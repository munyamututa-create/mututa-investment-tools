Members trades each weekMay 19Claude responded: Good question — yes, this data is publicly available and there are real ways to pull it.Searched the webSearched the webGood question — yes, this data is publicly available and there are real ways to pull it. Here's the honest breakdown:
The Data Is Real and Legally Public
Since 2012, the STOCK Act requires members of Congress to publicly disclose financial transactions over $1,000 within 45 days of the transaction. These are filed as Periodic Transaction Reports (PTRs). So the underlying data is legitimate — apps like the Pelosi tracker aren't doing anything shady, they're just surfacing public filings. AInvest API
The Alpha Question
The honest answer: the edge is overstated by those apps. The 45-day reporting lag means by the time you see a trade, the move has often already happened. Where there is signal is in sector clustering — if multiple members on the same committee are buying the same sector, that can be a leading indicator for favorable legislation.
